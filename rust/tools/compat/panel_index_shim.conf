# 临时兼容层：修复原版管理端首页依赖的 PanelIndexVO 嵌套字段
# 只接管 /adminapi/panel/panel/index，其余 /adminapi 仍走 8080。
location = /adminapi/panel/panel/index {
    proxy_pass http://127.0.0.1:8090;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Authorization $http_authorization;
    proxy_set_header X-ADMIN-TYPE $http_x_admin_type;
    proxy_set_header X-CLIENT-TYPE $http_x_client_type;
    proxy_set_header X-Locale-Code $http_x_locale_code;
    proxy_set_header X-Shop-Id $http_x_shop_id;
    proxy_http_version 1.1;
}

