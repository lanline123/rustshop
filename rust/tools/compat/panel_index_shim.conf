# 原版 MsgCount 初始 startTime 为空，Rust 严格 i64 解析会 400。
# 空值时重定向补 0，再走原 SSE 接口。
location = /adminapi/msg/adminMsg/msgCount {
    if ($arg_startTime = "") {
        return 302 /adminapi/msg/adminMsg/msgCount?startTime=0;
    }
    proxy_pass http://127.0.0.1:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Authorization $http_authorization;
    proxy_set_header X-ADMIN-TYPE $http_x_admin_type;
    proxy_set_header X-CLIENT-TYPE $http_x_client_type;
    proxy_set_header X-Locale-Code $http_x_locale_code;
    proxy_set_header X-Shop-Id $http_x_shop_id;
    proxy_http_version 1.1;
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    add_header X-Accel-Buffering no;
}
