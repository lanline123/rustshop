# TigShop Rust 生产反代参考配置
#
# 假设：
#   - 管理端前端 dist 位于 /usr/share/nginx/html/admin
#   - 商城 PC 前端 dist 位于 /usr/share/nginx/html/pc
#   - 管理端 API 监听 8080（/adminapi、/im、/static、/ws）
#   - 商城 API 监听 8181（/api、/ws）
#
# 关键点（与 Java 版路径约定一致）：
#   /adminapi -> 8080（管理端，含 /adminapi/login）
#   /im       -> 8080（管理端 IM 路由挂在根路径，不在 /adminapi 下）
#   /static   -> 8080（本地对象存储上传文件）
#   /api      -> 8181（C 端）
#   /ws       -> 8181（C 端 WebSocket）；管理端 WS 用 /adminws -> 8080
#   /metrics  -> 8080（Prometheus 抓取，建议仅内网放行）

upstream tigshop_admin {
    server 127.0.0.1:8080;
    keepalive 32;
}

upstream tigshop_api {
    server 127.0.0.1:8181;
    keepalive 32;
}

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;

    client_max_body_size 50m;
    proxy_read_timeout 120s;
    proxy_send_timeout 120s;

    # ---------- 管理端前端 ----------
    location / {
        root /usr/share/nginx/html/admin;
        try_files $uri $uri/ /index.html;
    }

    # ---------- 管理端 API ----------
    location /adminapi/ {
        proxy_pass http://tigshop_admin;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 管理端 IM 路由（原前端 prefix="/im"，不带 /adminapi 前缀）
    location /im/ {
        proxy_pass http://tigshop_admin;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 本地存储上传文件
    location /static/ {
        proxy_pass http://tigshop_admin;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        expires 7d;
        add_header Cache-Control "public";
    }

    # 管理端 WebSocket（客服工作台）
    location /adminws {
        proxy_pass http://tigshop_admin/ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # ---------- 商城 C 端 ----------
    location /api/ {
        proxy_pass http://tigshop_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /ws {
        proxy_pass http://tigshop_api/ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # ---------- 商城 PC 前端（独立 Vue SPA）----------
    # 后端 8181 **只提供 /api JSON**，不再返回任何 HTML
    # （Leptos SSR fallback 已于 2026-10-20 下线，见 main.rs 注释）。
    # PC SPA 产物：仓库根 `pc-web/` 执行 `pnpm build` → `dist/`。
    #
    # ⚠️ 注意 base 路径：`pc-web/vite.config.ts` 未设 `base`，默认按站点根 `/` 访问。
    #    若必须与后台同域挂在子路径，构建时需 `vite build --base=/pc/` 并同步 router base。
    #    推荐做法：给 PC 独立域名（如 mall.example.com）挂在 `/`，本 location 仅作兜底。
    location /pc/ {
        alias /usr/share/nginx/html/pc/;
        try_files $uri $uri/ /pc/index.html;
    }

    # Prometheus 指标（建议加 allow/deny 或仅内网）
    location = /metrics {
        proxy_pass http://tigshop_admin/metrics;
        proxy_set_header Host $host;
    }
}
