[workspace]
resolver = "2"
members = [
    "core",
    "services",
    "api/admin",
    "api/public",
    "api/openapi",
    "common",
    "infrastructure",
    "security",
    "bin",
]

default-members = ["bin"]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["TigShop Team"]
license = "MIT"
repository = "https://github.com/tigshop/tigshop-rust"

[workspace.dependencies]
# Chinese word segmentation (Java jieba-analysis equivalent)
jieba-rs = "0.7"

# Async runtime
tokio = { version = "1.43", features = ["full"] }
tokio-util = { version = "0.7", features = ["full"] }

# Web framework - Axum
axum = { version = "0.8", features = ["macros", "multipart", "form", "ws"] }
axum-extra = { version = "0.10", features = ["typed-routing", "query"] }
tower = { version = "0.5", features = ["full"] }
tower-http = { version = "0.6", features = ["cors", "trace", "compression-gzip", "fs"] }

# 注：曾依赖 Leptos 0.7 做 PC 端 SSR（crate `pc-web`），2026-10-20 已下线，
# 改为仓库根 `pc-web/` 的 Vue SPA。Leptos 依赖已移除，勿再加回。
# 备份：rust/backups/pc-web-backup-leptos

# HTTP
hyper = { version = "1.5", features = ["full"] }
hyper-util = { version = "0.1", features = ["full"] }
http = "1.2"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "rustls-tls-native-roots"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_urlencoded = "0.7"
serde_yaml = "0.9"

# Database - SQLx
sqlx = { version = "0.8", features = [
    "runtime-tokio-native-tls",
    "postgres",
    "mysql",
    "chrono",
    "uuid",
    "json",
    "ipnetwork",
    "time",
    "rust_decimal",
] }

# Cache - Redis（1.x 要求 rustc 1.88+；集群能力由 `cluster` / `cluster-async` 提供。
# 当前代码仅使用 ConnectionManager，故只保留 tokio-comp + connection-manager。）
redis = { version = "1.7", features = [
    "tokio-comp",
    "connection-manager",
] }

# Error handling
anyhow = "1.0"
thiserror = "2.0"
displaydoc = "0.2"

# Validation
validator = { version = "0.19", features = ["derive"] }

# UUID
uuid = { version = "1.12", features = ["serde", "v4"] }

# Time
chrono = { version = "0.4", features = ["serde"] }
time = { version = "0.3", features = ["serde", "formatting", "parsing"] }

# Logging & Tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json", "parking_lot"] }
tracing-appender = "0.2"

# JWT
jsonwebtoken = "9"
argon2 = "0.5"
bcrypt = "0.16"

# Config
config = "0.14"
dotenvy = "0.15"

# Cryptography
ring = "0.17"
rsa = { version = "0.9", features = ["sha2", "pem"] }
aes-gcm = "0.10"
aes = "0.8"
sha2 = "0.10"
hmac = "0.12"
sha1 = "0.10"
md-5 = "0.10"
hex = "0.4"
base64 = "0.22"

# Async utilities
async-trait = "0.1"
futures = "0.3"
async-stream = "0.3"

# File handling
mime_guess = "2.0"
filetime = "0.2"
walkdir = "2.5"
tempfile = "3.14"

# URL
url = "2.5"

# Regex
regex = "1.11"

# Random
rand = "0.8"

# Decimal (金额，对应原 Java BigDecimal)
rust_decimal = { version = "1.36", features = ["serde-with-str"] }

# Email
lettre = { version = "0.11", features = ["tokio1-native-tls", "smtp-transport", "builder"] }

# Prometheus metrics
prometheus = "0.13"

# OpenAPI documentation
utoipa = { version = "5", features = ["axum_extras"] }
utoipa-swagger-ui = { version = "8", features = ["axum"] }

# QR Code
qrcode = "0.14"

# Image processing
image = "0.25"

# Excel processing
calamine = "0.27"
rust_xlsxwriter = "0.77"

# IP Location
ipnetwork = "0.21"

# Map/Geo
geo = "0.29"

# Internationalization
i18n-embed = "0.15"
i18n-embed-fl = "0.9"

# Testing
mockall = "0.13"
testcontainers = "0.23"
test-context = "0.3"

# Caching
moka = { version = "0.12", features = ["future"] }

# Data structures
dashmap = "6.1"
ordered-float = "4.6"

[workspace.lints.rust]
unsafe_code = "forbid"
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(tokio_unstable)'] }

[workspace.lints.clippy]
all = "deny"
pedantic = "deny"
nursery = "deny"
cargo = "deny"

# Allow list for specific cases
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
struct_excessive_fields = "allow"
too_many_lines = "allow"

[profile.dev]
debug = 1 # Limited debug info for faster builds

[profile.dev.package."*"]
debug = 0 # Prevent LLVM out of memory on Windows MSVC


[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

[profile.bench]
debug = true
