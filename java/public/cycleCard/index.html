<!doctype html>
<html lang="zh-CN">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>我的次卡</title>
        <style>
            * { box-sizing: border-box; }
            body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: #f5f5f5; color: #333; }
            .wrap { max-width: 1200px; margin: 0 auto; padding: 24px; }
            h1 { font-size: 24px; margin: 0 0 20px; }
            .list { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 16px; }
            .card { display: flex; gap: 14px; padding: 16px; background: #fff; border-radius: 10px; cursor: pointer; transition: box-shadow .2s; }
            .card:hover { box-shadow: 0 4px 18px rgb(0 0 0 / 8%); }
            .pic { width: 92px; height: 92px; border-radius: 8px; object-fit: cover; background: #eee; }
            .info { display: flex; flex-direction: column; gap: 6px; flex: 1; min-width: 0; }
            .name { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
            .muted { font-size: 13px; color: #888; }
            .status { font-size: 13px; color: #ff5000; }
            .empty, .error { padding: 80px 0; text-align: center; color: #999; }
            .detail { padding: 20px; background: #fff; border-radius: 10px; }
            .row { display: flex; justify-content: space-between; padding: 12px 0; border-bottom: 1px solid #f2f2f2; font-size: 14px; }
            .back { display: inline-block; margin-bottom: 16px; color: #ff5000; cursor: pointer; }
            button { padding: 8px 20px; color: #fff; background: #ff5000; border: 0; border-radius: 6px; cursor: pointer; }
            .actions { margin-top: 20px; }
        </style>
    </head>
    <body>
        <div class="wrap">
            <div id="app"><div class="empty">加载中...</div></div>
        </div>
        <script>
            var app = document.getElementById("app");
            function token() {
                var m = document.cookie.match(/(?:^|; )accessToken=([^;]*)/);
                return m ? decodeURIComponent(m[1]) : "";
            }
            function statusText(status) {
                return { 0: "待生效", 1: "使用中", 2: "已用完", 3: "已过期", 4: "已退款" }[status] || "";
            }
            function request(path) {
                return fetch("/api/" + path, {
                    headers: { Authorization: "Bearer " + token() },
                    credentials: "include"
                }).then(function (r) { return r.json(); });
            }
            function renderList() {
                request("cycleCard/list?page=1&size=50")
                    .then(function (res) {
                        if (res.code !== 0) {
                            app.innerHTML = '<div class="error">' + (res.msg || "请先登录") + "</div>";
                            return;
                        }
                        var records = (res.data && res.data.records) || [];
                        if (!records.length) {
                            app.innerHTML = '<div class="empty">暂无次卡</div>';
                            return;
                        }
                        var html = '<h1>我的次卡</h1><div class="list">';
                        records.forEach(function (c) {
                            html +=
                                '<div class="card" data-id="' + c.cardId + '">' +
                                (c.productPic ? '<img class="pic" src="' + c.productPic + '" />' : '<div class="pic"></div>') +
                                '<div class="info"><div class="name">' + (c.productName || "") + "</div>" +
                                (c.skuValue ? '<div class="muted">' + c.skuValue + "</div>" : "") +
                                '<div class="muted">剩余 ' + c.remainingTimes + " / " + c.totalTimes + "</div>" +
                                '<div class="status">' + statusText(c.status) + "</div></div></div>";
                        });
                        app.innerHTML = html + "</div>";
                        app.querySelectorAll(".card").forEach(function (el) {
                            el.onclick = function () { renderDetail(el.getAttribute("data-id")); };
                        });
                    })
                    .catch(function () { app.innerHTML = '<div class="error">网络异常</div>'; });
            }
            function renderDetail(cardId) {
                request("cycleCard/detail/" + cardId).then(function (res) {
                    if (res.code !== 0 || !res.data) {
                        app.innerHTML = '<div class="error">' + (res.msg || "次卡不存在") + "</div>";
                        return;
                    }
                    var c = res.data;
                    var rows = [
                        ["总次数", c.totalTimes],
                        ["已使用", c.redeemedTimes],
                        ["剩余次数", c.remainingTimes],
                        ["订单号", c.orderSn],
                        ["支付金额", c.totalAmount],
                        ["状态", statusText(c.status)]
                    ];
                    var html = '<span class="back" id="back">← 返回列表</span><div class="detail"><h1>' + (c.productName || "") + "</h1>";
                    rows.forEach(function (row) {
                        html += '<div class="row"><span>' + row[0] + "</span><span>" + (row[1] ?? "") + "</span></div>";
                    });
                    html += '<div class="actions"><button id="check">检查是否可用</button></div></div>';
                    app.innerHTML = html;
                    document.getElementById("back").onclick = renderList;
                    document.getElementById("check").onclick = function () {
                        request("cycleCard/checkUsable/" + cardId).then(function (r) {
                            alert(r.code === 0 && r.data && r.data.usable ? "可使用" : "不可使用");
                        });
                    };
                });
            }
            renderList();
        </script>
    </body>
</html>
