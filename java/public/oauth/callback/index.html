<!doctype html>
<html lang="zh-CN">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>第三方登录</title>
        <style>
            body {
                display: flex;
                align-items: center;
                justify-content: center;
                min-height: 100vh;
                margin: 0;
                font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
                background: #f7f7f7;
            }
            .box {
                padding: 40px 56px;
                text-align: center;
                background: #fff;
                border-radius: 12px;
                box-shadow: 0 8px 30px rgb(0 0 0 / 8%);
            }
            .msg {
                margin-bottom: 18px;
                color: #666;
                font-size: 16px;
            }
            .error {
                color: #e54d42;
            }
            button {
                padding: 10px 28px;
                color: #fff;
                background: #ff5000;
                border: 0;
                border-radius: 6px;
                cursor: pointer;
            }
        </style>
    </head>
    <body>
        <div class="box">
            <div id="msg" class="msg">正在完成第三方登录...</div>
            <button id="back" type="button" style="display: none">返回登录</button>
        </div>
        <script>
            (function () {
                var msg = document.getElementById("msg");
                var back = document.getElementById("back");
                function fail(text) {
                    msg.className = "msg error";
                    msg.textContent = text || "第三方登录失败，请重试";
                    back.style.display = "inline-block";
                }
                back.onclick = function () {
                    location.href = "/member/Login";
                };
                function cookie(name) {
                    var m = document.cookie.match(new RegExp("(?:^|; )" + name + "=([^;]*)"));
                    return m ? decodeURIComponent(m[1]) : "";
                }
                var params = new URLSearchParams(location.search);
                var path = cookie("oauthPath") || params.get("source") || params.get("platform") || "";
                var code = params.get("code") || "";
                if (!path || !code) {
                    fail("缺少授权参数，请重新登录");
                    return;
                }
                var body = {};
                params.forEach(function (value, key) {
                    body[key] = value;
                });
                fetch(
                    "/api/user/oauth/callback/" +
                        encodeURIComponent(path) +
                        "?redirectUri=" +
                        encodeURIComponent(location.href),
                    {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        credentials: "include",
                        body: JSON.stringify(body)
                    }
                )
                    .then(function (res) {
                        return res.json();
                    })
                    .then(function (res) {
                        var token = res && res.data && res.data.token ? res.data.token : "";
                        if (!token) {
                            fail((res && (res.msg || res.message)) || "登录失败");
                            return;
                        }
                        document.cookie = "accessToken=" + encodeURIComponent(token) + "; path=/; max-age=2592000; samesite=lax";
                        var returnUrl = cookie("oauthReturnUrl") || "/";
                        location.replace(returnUrl);
                    })
                    .catch(function () {
                        fail("网络异常，请重试");
                    });
            })();
        </script>
    </body>
</html>
