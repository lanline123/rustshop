spring:
  profiles:
    active: dev

  servlet:
    multipart:
      # Keep the multipart limit aligned with the admin uploadMaxSize setting (100 MB).
      max-file-size: 200MB
      max-request-size: 200MB

mybatis-plus:
  mapper-locations: classpath*:mapper/**/*.xml
  configuration:
    log-impl: ""

# 滑块验证码
aj:
  captcha:
    # 缓存类型
    cache-type: redis
    # blockPuzzle 滑块 clickWord 文字点选  default默认两者都实例化
    type: blockPuzzle
    # 右下角显示字
    water-mark:
    # 校验滑动拼图允许误差偏移量(默认5像素)
    slip-offset: 5
    # aes加密坐标开启或者禁用(true|false)
    aes-status: true
    # 滑动干扰项(0/1/2)
    interference-options: 1

# springdoc-openapi项目配置
springdoc:
  # API文档, 默认路径:swagger-ui.html
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
  api-docs:
    path: /v3/api-docs
  # 配置需要生成接口文档的扫描包路径
  packages-to-scan: com.tigshop.api.controller
  group-configs:
    - group: '搜索'
      paths-to-match: '/api/search/**'
    - group: '商户'
      paths-to-match: '/api/merchant/**'
    - group: '文章'
      paths-to-match: '/api/article/**'
    - group: '分销'
      paths-to-match: '/api/salesman/**'
    - group: '商品'
      paths-to-match: '/api/product/**'
    - group: '订单'
      paths-to-match: '/api/order/**'
    - group: '商品分类'
      paths-to-match: '/api/category/**'
    - group: '首页'
      paths-to-match: '/api/home/**'
    - group: '购物车'
      paths-to-match: '/api/cart/**'
    - group: '会员中心'
      paths-to-match: '/api/user/**'
    - group: '公共方法'
      paths-to-match: '/api/common/**'
    - group: '店铺'
      paths-to-match: '/api/shop/**'
    - group: '买家秀'
      paths-to-match: '/api/buyerShow/buyerShow/**'
    - group: '配送和服务订单'
      paths-to-match: '/api/o2o/deliveryOrder/**'
    - group: '配送和服务人员'
      paths-to-match: '/api/o2o/serviceStaff/**'
    - group: '多门店'
      paths-to-match: '/api/o2o/**'
    - group: '内容/直播'
      paths-to-match: '/api/content/**'
    - group: '装修'
      paths-to-match: '/api/decorate/**'
    - group: '营销'
      paths-to-match: '/api/promotion/**'
    - group: '系统'
      paths-to-match: '/api/sys/**'
#IM
    - group: '会话和消息'
      paths-to-match: '/im/conversation/**'
    - group: 'WebSocket'
      paths-to-match: '/api/socket/**'
    - group: '批发'
      paths-to-match: '/api/wholesale/**'
    - group: 'all'
      paths-to-match: '/**'
# knife4j的增强配置，不需要增强可以不配
knife4j:
  enable: true
  setting:
    language: zh_cn

logging:
  level:
    com.tigshop: warn
    org.springframework: warn
    org.apache.ibatis: debug

# 内部服务间调用配置
internal:
  api:
    # 内部 API 密钥，用于服务间调用认证（生产环境请修改为强密码）
    key: ${INTERNAL_API_KEY:your-secure-internal-api-key-change-me}

tigshop:
  name: TigShop
  version: JAVA-B2B2B-PRO
  version-num: v5.8.57
  is-merchant: 1
  is-b2b: 1
  is-pro: 1
  is-overseas: 0
  is-vendor: 0
  is-o2o: 0
  is-demo: 0
  # 兼容旧配置；批发菜单显隐由 VORT common.wholesale 编译开关决定
  is-common-wholesale: 0
  # 调试模式：1=本地/演示站（暴露错误详情、详细日志等），0=发客户（默认，隐藏）
  is-debug: 0
  # 官网增强授权：API 启动执行 register/sync；无定时回源，异常按 FAIL_OPEN 记录并放行
  authorization:
    enabled: ${TIGSHOP_AUTHORIZATION_ENABLED:true}
    base-url: ${TIGSHOP_AUTHORIZATION_BASE_URL:https://api.tigshop.com/index}
    identity-path: ${TIGSHOP_IDENTITY_PATH:${user.home}/.tigshop/identity/instance.json}
    identity-master-key-path: ${TIGSHOP_IDENTITY_MASTER_KEY_PATH:}
    package-manifest-path: ${TIGSHOP_PACKAGE_MANIFEST_PATH:config/tigshop-package-distribution.json}
    startup-report-enabled: ${TIGSHOP_API_STARTUP_REPORT_ENABLED:true}
    enforcement-mode: OBSERVE_ONLY
    error-mode: FAIL_OPEN
    connect-timeout-ms: 3000
    read-timeout-ms: 5000

jwt:
  # JWT密钥（生产环境请修改为强密钥,必填）
  secret: 213213123213
  # Token过期时间（分钟），默认30天: 60 * 24 * 30 = 43200
  expire: ${JWT_EXPIRE:43200}

icoTigCss: https://at.alicdn.com/t/c/font_4441878_vnkd9jp6k1.css
