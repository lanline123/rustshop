name: build-rust-backend

# 在 GitHub Actions 上构建 Linux x86_64 后端，并发布到 Release。
# 关键点：用 rockylinux:8 容器（glibc 2.28），与目标服务器
# Alibaba Cloud Linux 3（AL8 / glibc 2.28）一致，产物可直接运行。
on:
  push:
    branches: [main]
    paths:
      - 'rust/crates/**'
      - '.github/workflows/build-rust.yml'
  workflow_dispatch:

# 需要写权限：创建 Release 并上传资产
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04
    container: rockylinux:8
    steps:
      - name: Install git & build deps
        run: |
          dnf install -y git gcc gcc-c++ make pkgconfig openssl-devel perl which tar xz curl
          dnf clean all

      - uses: actions/checkout@v4

      - name: Install Rust 1.99.0
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
            | sh -s -- -y --profile minimal --default-toolchain 1.99.0
          . "$HOME/.cargo/env"
          rustc --version
          cargo --version

      - name: Build release binary
        working-directory: rust/crates
        env:
          PKG_CONFIG_PATH: /usr/lib64/pkgconfig:/usr/share/pkgconfig
          CARGO_BUILD_JOBS: "4"
        run: |
          . "$HOME/.cargo/env"
          cargo build --release -p tigshop-server

      - name: Package binary
        working-directory: rust/crates
        run: |
          set -euo pipefail
          mkdir -p /tmp/out
          cp target/release/tigshop /tmp/out/tigshop
          chmod 755 /tmp/out/tigshop
          strip /tmp/out/tigshop || true
          sha256sum /tmp/out/tigshop | tee /tmp/out/tigshop.sha256
          ls -lh /tmp/out

      # 先上传 artifact（不依赖 contents 写权限），保证一定有可下载产物
      - uses: actions/upload-artifact@v4
        with:
          name: rustshop-linux-x86_64
          path: /tmp/out/
          if-no-files-found: error

      # 再发布 Release（失败不影响 artifact；rockylinux:8 的 curl 7.61 不支持 --fail-with-body，只能用 -f）
      - name: Publish release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="build-${GITHUB_RUN_NUMBER}"
          AUTH="Authorization: Bearer ${GH_TOKEN}"
          API="https://api.github.com/repos/${GITHUB_REPOSITORY}"

          echo "creating release ${TAG}"
          curl -fsS -X POST \
            -H "${AUTH}" \
            -H "Accept: application/vnd.github+json" \
            "${API}/releases" \
            -d "{\"tag_name\":\"${TAG}\",\"name\":\"${TAG}\",\"body\":\"commit ${GITHUB_SHA} / rockylinux:8 glibc 2.28\"}" \
            -o /tmp/release.json || { echo "release create failed"; cat /tmp/release.json 2>/dev/null; exit 1; }
          cat /tmp/release.json

          echo "uploading asset"
          curl -fsS -X POST \
            -H "${AUTH}" \
            -H "Content-Type: application/octet-stream" \
            --data-binary @/tmp/out/tigshop \
            "https://uploads.github.com/repos/${GITHUB_REPOSITORY}/releases/tags/${TAG}/assets?name=tigshop" \
            -o /tmp/asset.json || { echo "asset upload failed"; cat /tmp/asset.json 2>/dev/null; exit 1; }
          cat /tmp/asset.json

          echo "done: https://github.com/${GITHUB_REPOSITORY}/releases/tag/${TAG}"
