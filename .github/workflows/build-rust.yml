name: build-rust-backend

# 在 GitHub Actions 上构建 Linux x86_64 后端，并发布到 Release。
# 关键点：用 rockylinux:8 容器（glibc 2.28），与目标服务器
# Alibaba Cloud Linux 3（AL8 / glibc 2.28）一致，产物可直接运行。
on:
  push:
    branches: [main]
    paths:
      - 'rust/crates/**'
      - '.github/workflows/build-rust.yml'
  workflow_dispatch:

permissions:
  contents: write

env:
  # sccache：按内容哈希缓存 rustc 编译结果，不受源码 mtime 影响（比 target 目录缓存可靠）
  SCCACHE_VERSION: v0.18.0
  SCCACHE_DIR: /tmp/sccache
  SCCACHE_CACHE_SIZE: 5G
  RUSTC_WRAPPER: /usr/local/bin/sccache

jobs:
  build:
    runs-on: ubuntu-22.04
    container: rockylinux:8
    env:
      # 容器内固定 target 目录（用于最终的 LTO 链接产物）
      CARGO_TARGET_DIR: /tmp/cargo-target
      SCCACHE_DIR: /tmp/sccache
      SCCACHE_CACHE_SIZE: 5G
      RUSTC_WRAPPER: /usr/local/bin/sccache
    steps:
      # Rocky 默认 mirrorlist 在 GitHub 机房可能极慢（实测 17 分钟），固定官方 CDN
      - name: Install git & build deps
        run: |
          set -e
          sed -i -e 's|^mirrorlist=|#mirrorlist=|g' \
                 -e 's|^#baseurl=http://dl.rockylinux.org|baseurl=https://dl.rockylinux.org|g' \
                 /etc/yum.repos.d/Rocky-*.repo 2>/dev/null || true
          dnf install -y --setopt=install_weak_deps=False --nodocs \
            git gcc gcc-c++ make pkgconfig openssl-devel perl which tar xz curl jq
          dnf clean all

      - uses: actions/checkout@v4

      - name: Install Rust (follows rust/crates/rust-toolchain.toml)
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
            | sh -s -- -y --profile minimal
          . "$HOME/.cargo/env"
          rustc --version
          cargo --version

      - name: Install sccache
        run: |
          set -e
          curl -fsSL -o /tmp/sccache.tar.gz \
            "https://github.com/mozilla/sccache/releases/download/${SCCACHE_VERSION}/sccache-${SCCACHE_VERSION}-x86_64-unknown-linux-musl.tar.gz"
          tar -xzf /tmp/sccache.tar.gz -C /tmp
          install -m 755 "/tmp/sccache-${SCCACHE_VERSION}-x86_64-unknown-linux-musl/sccache" /usr/local/bin/sccache
          sccache --version

      # 缓存 cargo registry、target 与 sccache 编译缓存
      - name: Cache cargo registry, target & sccache
        uses: actions/cache@v4
        with:
          path: |
            /github/home/.cargo/registry
            /github/home/.cargo/git
            /tmp/cargo-target
            /tmp/sccache
          key: cargo-v3-${{ runner.os }}-${{ hashFiles('rust/crates/Cargo.lock') }}-${{ github.run_id }}
          restore-keys: |
            cargo-v3-${{ runner.os }}-${{ hashFiles('rust/crates/Cargo.lock') }}-
            cargo-v3-${{ runner.os }}-

      - name: Build release binary
        working-directory: rust/crates
        env:
          PKG_CONFIG_PATH: /usr/lib64/pkgconfig:/usr/share/pkgconfig
          RUSTC_WRAPPER: /usr/local/bin/sccache
          SCCACHE_DIR: /tmp/sccache
          SCCACHE_CACHE_SIZE: 5G
        run: |
          . "$HOME/.cargo/env"
          sccache --start-server || true
          cargo build --release -p tigshop-server
          sccache --show-stats || true

      - name: Package binary
        working-directory: rust/crates
        run: |
          set -euo pipefail
          mkdir -p /tmp/out
          cp "${CARGO_TARGET_DIR}/release/tigshop" /tmp/out/rustshop
          chmod 755 /tmp/out/rustshop
          strip /tmp/out/rustshop || true
          ( cd /tmp/out && sha256sum rustshop > rustshop.sha256 )
          ls -lh /tmp/out

      # 先上传 artifact（不依赖写权限），保证一定有可下载产物
      - uses: actions/upload-artifact@v4
        with:
          name: rustshop-linux-x86_64
          path: /tmp/out/
          if-no-files-found: error

      # 发布 Release：上传资产必须用 release ID 路径（tags 路径会 400）
      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="build-${GITHUB_RUN_NUMBER}"
          AUTH="Authorization: Bearer ${GH_TOKEN}"
          API="https://api.github.com/repos/${GITHUB_REPOSITORY}"

          echo "creating release ${TAG}"
          curl -fsS -X POST \
            -H "${AUTH}" \
            -H "Accept: application/vnd.github+json" \
            "${API}/releases" \
            -d "{\"tag_name\":\"${TAG}\",\"name\":\"${TAG}\",\"body\":\"commit ${GITHUB_SHA} / rockylinux:8 glibc 2.28\"}" \
            -o /tmp/release.json
          cat /tmp/release.json
          RID=$(jq -r .id /tmp/release.json)
          echo "release id: ${RID}"

          echo "uploading binary"
          curl -fsS -X POST \
            -H "${AUTH}" \
            -H "Content-Type: application/octet-stream" \
            --data-binary @/tmp/out/rustshop \
            "https://uploads.github.com/repos/${GITHUB_REPOSITORY}/releases/${RID}/assets?name=rustshop" \
            -o /tmp/asset.json
          cat /tmp/asset.json

          echo "uploading checksum"
          curl -fsS -X POST \
            -H "${AUTH}" \
            -H "Content-Type: application/octet-stream" \
            --data-binary @/tmp/out/rustshop.sha256 \
            "https://uploads.github.com/repos/${GITHUB_REPOSITORY}/releases/${RID}/assets?name=rustshop.sha256" \
            -o /tmp/asset2.json
          cat /tmp/asset2.json

          echo "download: https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/rustshop"
