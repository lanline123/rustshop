name: build-rust-backend

# 在 GitHub Actions 上构建 Linux x86_64 后端，并发布到 Release。
# 关键点：用 rockylinux:8 容器（glibc 2.28），与目标服务器
# Alibaba Cloud Linux 3（AL8 / glibc 2.28）一致，产物可直接运行。
on:
  push:
    branches: [main]
    paths:
      - 'rust/crates/**'
      - '.github/workflows/build-rust.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04
    container: rockylinux:8
    steps:
      - name: Install git & build deps
        run: |
          dnf install -y git gcc gcc-c++ make pkgconfig openssl-devel perl which tar xz curl jq
          dnf clean all

      - uses: actions/checkout@v4

      - name: Install Rust (follows rust/crates/rust-toolchain.toml)
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
            | sh -s -- -y --profile minimal
          . "$HOME/.cargo/env"
          rustc --version
          cargo --version

      # 缓存 ~/.cargo 与 target/：依赖不重复编译，改动后只重编工作区 crate
      - name: Cargo build cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust/crates -> target
          cache-on-failure: true

      - name: Build release binary
        working-directory: rust/crates
        env:
          PKG_CONFIG_PATH: /usr/lib64/pkgconfig:/usr/share/pkgconfig
        run: |
          . "$HOME/.cargo/env"
          cargo build --release -p tigshop-server

      - name: Package binary
        working-directory: rust/crates
        run: |
          set -euo pipefail
          mkdir -p /tmp/out
          cp target/release/tigshop /tmp/out/tigshop
          chmod 755 /tmp/out/tigshop
          strip /tmp/out/tigshop || true
          sha256sum /tmp/out/tigshop | tee /tmp/out/tigshop.sha256
          ls -lh /tmp/out

      # 先上传 artifact（不依赖写权限），保证一定有可下载产物
      - uses: actions/upload-artifact@v4
        with:
          name: rustshop-linux-x86_64
          path: /tmp/out/
          if-no-files-found: error

      # 发布 Release：上传资产必须用 release ID 路径（tags 路径会 400）
      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="build-${GITHUB_RUN_NUMBER}"
          AUTH="Authorization: Bearer ${GH_TOKEN}"
          API="https://api.github.com/repos/${GITHUB_REPOSITORY}"

          echo "creating release ${TAG}"
          curl -fsS -X POST \
            -H "${AUTH}" \
            -H "Accept: application/vnd.github+json" \
            "${API}/releases" \
            -d "{\"tag_name\":\"${TAG}\",\"name\":\"${TAG}\",\"body\":\"commit ${GITHUB_SHA} / rockylinux:8 glibc 2.28\"}" \
            -o /tmp/release.json
          cat /tmp/release.json
          RID=$(jq -r .id /tmp/release.json)
          echo "release id: ${RID}"

          echo "uploading binary"
          curl -fsS -X POST \
            -H "${AUTH}" \
            -H "Content-Type: application/octet-stream" \
            --data-binary @/tmp/out/tigshop \
            "https://uploads.github.com/repos/${GITHUB_REPOSITORY}/releases/${RID}/assets?name=tigshop" \
            -o /tmp/asset.json
          cat /tmp/asset.json

          echo "uploading checksum"
          curl -fsS -X POST \
            -H "${AUTH}" \
            -H "Content-Type: application/octet-stream" \
            --data-binary @/tmp/out/tigshop.sha256 \
            "https://uploads.github.com/repos/${GITHUB_REPOSITORY}/releases/${RID}/assets?name=tigshop.sha256" \
            -o /tmp/asset2.json
          cat /tmp/asset2.json

          echo "download: https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/tigshop"
