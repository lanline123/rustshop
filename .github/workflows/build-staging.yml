name: build-rust-staging

# 测试/预发布构建：thin LTO + 并行 codegen，比正式 release 快。
# 只产出 artifact，不发布 Release；正式上线仍手动触发 build-rust-backend。
on:
  workflow_dispatch:

permissions:
  contents: read

env:
  SCCACHE_VERSION: v0.18.0
  SCCACHE_DIR: /tmp/sccache
  SCCACHE_CACHE_SIZE: 5G
  RUSTC_WRAPPER: /usr/local/bin/sccache

jobs:
  build:
    runs-on: ubuntu-22.04
    container: rockylinux:8
    env:
      CARGO_TARGET_DIR: /tmp/cargo-target
      SCCACHE_DIR: /tmp/sccache
      SCCACHE_CACHE_SIZE: 5G
      RUSTC_WRAPPER: /usr/local/bin/sccache
    steps:
      - name: Install git & build deps
        run: |
          set -e
          sed -i -e 's|^mirrorlist=|#mirrorlist=|g' \
                 -e 's|^#baseurl=http://dl.rockylinux.org|baseurl=https://dl.rockylinux.org|g' \
                 /etc/yum.repos.d/Rocky-*.repo 2>/dev/null || true
          dnf install -y --setopt=install_weak_deps=False --nodocs \
            git gcc gcc-c++ make pkgconfig openssl-devel perl which tar xz curl
          dnf clean all

      - uses: actions/checkout@v4

      - name: Install Rust
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
            | sh -s -- -y --profile minimal
          . "$HOME/.cargo/env"
          rustc --version

      - name: Install sccache
        run: |
          set -e
          curl -fsSL -o /tmp/sccache.tar.gz \
            "https://github.com/mozilla/sccache/releases/download/${SCCACHE_VERSION}/sccache-${SCCACHE_VERSION}-x86_64-unknown-linux-musl.tar.gz"
          tar -xzf /tmp/sccache.tar.gz -C /tmp
          install -m 755 "/tmp/sccache-${SCCACHE_VERSION}-x86_64-unknown-linux-musl/sccache" /usr/local/bin/sccache

      - name: Cache cargo registry, target & sccache
        uses: actions/cache@v4
        with:
          path: |
            /github/home/.cargo/registry
            /github/home/.cargo/git
            /tmp/cargo-target
            /tmp/sccache
          key: staging-cargo-${{ runner.os }}-${{ hashFiles('rust/crates/Cargo.lock') }}-${{ github.run_id }}
          restore-keys: |
            staging-cargo-${{ runner.os }}-${{ hashFiles('rust/crates/Cargo.lock') }}-
            staging-cargo-${{ runner.os }}-

      - name: Build staging binary
        working-directory: rust/crates
        env:
          PKG_CONFIG_PATH: /usr/lib64/pkgconfig:/usr/share/pkgconfig
        run: |
          . "$HOME/.cargo/env"
          sccache --start-server || true
          cargo build --profile staging -p tigshop-server
          sccache --show-stats || true

      - name: Package staging binary
        working-directory: rust/crates
        run: |
          set -euo pipefail
          mkdir -p /tmp/out
          cp "${CARGO_TARGET_DIR}/staging/tigshop" /tmp/out/rustshop-staging
          chmod 755 /tmp/out/rustshop-staging
          strip /tmp/out/rustshop-staging || true
          ( cd /tmp/out && sha256sum rustshop-staging > rustshop-staging.sha256 )
          ls -lh /tmp/out

      - uses: actions/upload-artifact@v4
        with:
          name: rustshop-staging-linux-x86_64
          path: /tmp/out/
          if-no-files-found: error
